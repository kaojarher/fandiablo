 if(P.gold<price)return say('靈石不足，此秘笈需 💎'+price);P.gold-=price;P.skills[id]=lvl+1;say(`📜 購得${s.book}，${lvl?'功法精進至 Lv'+(lvl+1):'習得新功法 '+s.icon+s.name}`);pn('秘笈')}
function rollAuction(){const r=Math.random();
 if(r<.28){const s=SK[R(SK.length)],lvl=P.skills[s.id]||0;P.auction={type:'skill',id:s.id,price:600+lvl*300}}
 else if(r<.56){const o=mkGear(3+R(2));P.auction={type:'gear',o,price:o.v*14}}
 else if(r<.78){const t=PT[R(PT.length)],lv=1+R(3);P.auction={type:'pet',t,lv,price:300+lv*220}}
 else{const pk=['pei','ju','zhu'][R(3)],qty=3+R(6);P.auction={type:'pill',pk,qty,price:({pei:15,ju:25,zhu:45})[pk]*qty}}}
function buyAuction(){const a=P.auction;if(!a)return;if(P.gold<a.price)return say('靈石不足，此標的需 💎'+a.price);
 P.gold-=a.price;
 if(a.type=='skill'){const s=SK.find(v=>v.id==a.id),lvl=P.skills[a.id]||0;P.skills[a.id]=lvl+1;say(`🏆 拍得${s.book}！${lvl?'功法精進至 Lv'+(lvl+1):'習得新功法 '+s.icon+s.name}`)}
 else if(a.type=='gear'){const o=a.o;if(!P.e[o.k])P.e[o.k]=o;else if(P.bag.length<20)P.bag.push(o);else P.gold+=o.v*3;say(`🏆 拍得 ${it(o)}！`)}
 else if(a.type=='pet'){P.pets.push({e:a.t[0],n:a.t[1],lv:a.lv,xp:0});say(`🏆 拍得 ${a.t[0]}${a.t[1]}（Lv${a.lv}）！`)}
 else{const PN={pei:'培元丹',ju:'聚氣丹',zhu:'築基丹'};P.pill[a.pk]+=a.qty;say(`🏆 拍得 ${PN[a.pk]}×${a.qty}！`)}
 P.auction=null;pn('拍賣')}

 if(Math.random()<a[4]){P.pill[a[1]]++;say(`🔥 煉成 ${a[0]}！`)}else say('💥 丹爐炸裂，藥材盡毀…');sfx(400);pn('煉丹')}

 P.gold+=price;say(`已賣出 ${p.e}${p.n}（Lv${p.lv}），得 💎${price}`);pn('靈寵')}
