<style>
:root{--bg:#0b0a12;--fg:#e8e2d0;--gold:#e0b050;--jade:#3fb68b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Noto Serif TC","PMingLiU",serif;overscroll-behavior:none;user-select:none}
#cw{position:fixed;inset:0;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000}
#hud{position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);width:min(94vw,620px);z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px}
#h1{font-size:12.5px;color:var(--gold);background:rgba(11,10,18,.6);padding:2px 10px;border-radius:8px;backdrop-filter:blur(2px)}
#log{width:100%;height:4.3em;font-size:12px;line-height:1.16;color:#cbbfa0;overflow:hidden;background:rgba(16,12,24,.62);border:1px solid #3a3020;border-radius:6px;padding:3px 6px;backdrop-filter:blur(2px)}
#joy{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom) + 120px);width:110px;height:110px;border-radius:50%;background:rgba(35,29,51,.55);border:2px solid #6a5a2a;z-index:5}
#joy i{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:#8a7030;pointer-events:none}
#bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 6px);display:flex;align-items:flex-end;justify-content:center;gap:10px;z-index:5;padding:0 8px}
.orb{position:relative;flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;background:rgba(16,10,14,.75);border:3px solid #8a7030;box-shadow:inset 0 0 14px #000}
.orb i{position:absolute;left:0;right:0;bottom:0;height:100%}
.orb b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;text-shadow:0 0 3px #000,0 0 3px #000}
#mid{display:grid;grid-template-columns:repeat(5,42px);gap:4px;background:rgba(11,10,18,.5);border-radius:10px;padding:4px}
button{font:inherit;font-size:17px;min-width:42px;height:42px;padding:0;background:#231d33;color:var(--fg);border:1px solid #6a5a2a;border-radius:10px}
button:active,button.on{background:#3b2f57}button:focus-visible{outline:2px solid var(--jade)}
#pn{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:9}#pn[hidden]{display:none}
#pb{width:min(94vw,520px);max-height:88vh;overflow:auto;background:#15111f;border:2px solid #6a5a2a;border-radius:12px;padding:10px;touch-action:pan-y}
#tb{display:flex;flex-wrap:wrap;gap:3px}
#pb button{height:34px;min-width:0;font-size:14px;padding:0 9px;margin:2px}
#ms{min-height:1.4em;color:var(--gold);font-size:13px;margin:5px 0}
#pc{line-height:1.9;font-size:14px}hr{border:0;border-top:1px solid #3a3020}small{color:#9a9080}
.fb{display:inline-block;border:1px solid #6a5a2a;border-radius:10px;padding:7px 9px;background:#231d33;font-size:14px}
@media (hover:hover) and (pointer:fine){#joy{display:none}}
/* Diablo 風格：石灰底 + 金邊面板 */
#pb{background:linear-gradient(#1d1c22,#100f14);border:3px solid #9a8a4a;box-shadow:0 0 0 3px #241f10 inset,0 0 22px rgba(0,0,0,.6)}
#tb button{border-color:#9a8a4a}
.dbchar{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.dbstats{flex:1;min-width:150px;background:rgba(0,0,0,.28);border:1px solid #6a5a2a;border-radius:6px;padding:6px}
.dbrow{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;padding:3px 4px;border-bottom:1px solid #2c2718}
.dbrow:last-child{border-bottom:0}
.dbrow span{color:#9a9080}.dbrow b{color:var(--gold);font-weight:600}
.dbdoll{flex:none;width:110px;display:flex;flex-direction:column;gap:10px;align-items:center;background:radial-gradient(circle at 50% 25%,#3c3c46,#0f0e13);border:1px solid #9a8a4a;border-radius:10px;padding:10px}
.slot{width:52px;height:52px;border:2px solid #9a8a4a;border-radius:8px;background:#15131c;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:inset 0 0 8px #000}
.slot .empty{opacity:.22}
.belt{display:flex;gap:7px;margin:2px 0 6px}
.belts{position:relative;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#3a3f4a,#151317);border:2px solid #9a8a4a;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.belts .lv{position:absolute;right:-3px;bottom:-3px;font-size:9px;background:#000;color:#fc4;border-radius:4px;padding:0 3px;border:1px solid #6a5a2a}
.dbinv{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.cell{border:2px solid #6a5a2a;border-radius:6px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#1a1723;font-size:10.5px;text-align:center}
.cell span{font-size:20px}
.cell button{height:22px;font-size:10px;min-width:0;padding:0 4px;margin:1px 0 0}
.empty2{grid-column:1/-1;color:#9a9080;font-size:13px;padding:6px 0}
/* HUD 法術按鈕：未習得則灰階鎖定，已習得顯示等級角標 */
#mid button{position:relative}
#mid button .lv{position:absolute;right:1px;bottom:1px;font-size:9px;line-height:1.15;background:#000;color:#fc4;border-radius:3px;padding:0 2px;border:1px solid #6a5a2a}
#mid button.off{opacity:.3;filter:grayscale(1)}
/* 城鎮：銀灰色系 */
body.town{--bg:#2b2d31}
body.town #h1{color:#dfe2e6;background:rgba(43,45,49,.65)}
body.town #log{color:#cdd1d6;background:rgba(32,34,38,.65);border-color:#8a8f97}
body.town #joy{background:rgba(64,67,73,.55);border-color:#9a9ea6}
body.town .orb{border-color:#9a9ea6}
body.town #mid{background:rgba(43,45,49,.55)}
body.town button{background:#3d4046;border-color:#9a9ea6}
body.town button:active,body.town button.on{background:#585c64}
</style></head><body>
<div id="cw"><canvas id="c"></canvas>

<div id="bar"><div class="orb" id="ho"><i style="background:linear-gradient(#f55,#900)"></i><b id="ht"></b></div><div id="mid"><button id="bs" title="青竹蜂雲劍(空白)">⚔️</button><button id="bl" title="羅燕步(R)">👣</button><button id="bj" title="青元劍訣(F)">💠</button><button id="bx" title="血影遁(T)">🌑</button><button id="bc" title="淺藍冰焰(G)">❄️</button><button id="bp" title="培元丹(Q)">🧪</button><button id="bh" title="縮地符－返城(H)">🌀</button><button data-t="裝備" title="裝備(C)">🛡️</button><button data-t="物品" title="物品(I)">🎒</button><button data-t="煉丹" title="煉丹">⚗️</button><button data-t="靈植" title="靈植">🌱</button><button data-t="靈寵" title="靈寵">🐾</button><button data-t="功法" title="功法(K)">📜</button><button data-t="丹藥" title="丹藥閣">🏺</button><button data-t="兵器" title="兵器閣">⚔️</button><button data-t="秘笈" title="秘笈閣">📚</button><button data-t="拍賣" title="拍賣會">🏮</button><button data-t="系統" title="存檔/系統">⚙️</button></div><div class="orb" id="mo"><i style="background:linear-gradient(#5af,#127)"></i><b id="mt"></b></div></div>
</div>
<div id="pn" hidden><div id="pb"><div id="tb"></div><div id="ms"></div><div id="pc"></div><button onclick="cls()">✖ 關閉</button></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d'),TW=64,TH=32,WH=34,R=n=>Math.random()*n|0;
let W=cv.width=innerWidth,H=cv.height=innerHeight;
addEventListener('resize',()=>{W=cv.width=innerWidth;H=cv.height=innerHeight});
const RE=['煉氣','築基','結丹','元嬰','化神'],ZN=['七玄門後山','黃楓谷','血色禁地','亂星海','魔道戰場'],
MO=[['🐺','妖狼',12,4,0,6],['🕷️','毒蛛',10,5,0,7],['👻','鬼修',16,6,1,10],['🐍','青鱗蛇',14,5,1,8]],
RA=[['凡','#ccc',1],['靈','#5af',1.5],['仙','#fc4',2.2]],WN=['飛劍','靈刃','古劍'],AN=['法袍','靈甲','護心鏡'];
let g,P,pp,dead=0,LG=[],ac,tm,dp,KX=0,KY=0,JX=0,JY=0,camX=0,camY=0,fl=[],fx=[],lt=0,fr=0;
const ev=k=>P.e[k]?P.e[k].v:0,A=()=>3+P.lv*2+ev('w')+(ev('r')>>1),D=()=>P.lv+ev('a')+(ev('r')>>1),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),
solid=(u,v)=>g.M[v|0]?.[u|0]!==0,flo=(u,v,s,c)=>fl.push({x:u,y:v,s,c,t:.8});
function say(t){$('ms').innerHTML=t;LG.push(t);LG=LG.slice(-4);$('log').innerHTML=LG.join('<br>')}
function step(o,dx,dy,r=.28){for(const[a,b]of[[dx,0],[0,dy]]){const nx=o.x+a,ny=o.y+b;if(![[-r,-r],[r,-r],[-r,r],[r,r]].some(([p,q])=>solid(nx+p,ny+q))){o.x=nx;o.y=ny}}}

/* 開闊迷宮：遞迴回溯 → 走道放大為 3 格寬 → 挖大廳 → 打通牆壁成環路 */
function init(reset,f=1){
 if(reset)P=newP(),LG=[];
 dead=0;fl=[];fx=[];
 if(f===0)return initTown();
 P.floor=f;
 const k=10,N=2*k+1,m=Array.from({length:N},()=>Array(N).fill(1)),st=[[1,1]];m[1][1]=0;
 while(st.length){const[a,b]=st[st.length-1],n=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dy])=>{const u=a+dx,v=b+dy;return u>0&&v>0&&u<N-1&&v<N-1&&m[v][u]});
  if(!n.length){st.pop();continue}
  const[dx,dy]=n[R(n.length)];m[b+dy/2][a+dx/2]=0;m[b+dy][a+dx]=0;st.push([a+dx,b+dy])}
 for(let i=0;i<N*2;i++){const u=1+R(N-2),v=1+R(N-2);if(m[v][u]&&(u+v)%2)m[v][u]=0}
 const off=[];let G=0;for(let i=0;i<N;i++){off[i]=G;G+=i%2?3:1}
 const M=Array.from({length:G},()=>Array(G).fill(1));
 for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(!m[j][i])for(let a=0;a<(i%2?3:1);a++)for(let b=0;b<(j%2?3:1);b++)M[off[j]+b][off[i]+a]=0;
 for(let r=0;r<6;r++){const w=6+R(6),h=6+R(6),u=1+R(G-w-2),v=1+R(G-h-2);for(let j=v;j<v+h;j++)for(let i=u;i<u+w;i++)M[j][i]=0}
 const c=[];M.forEach((r,v)=>r.forEach((q,u)=>{if(!q&&u+v>14)c.push([u+.5,v+.5])}));
 c.sort((a,b)=>b[0]+b[1]-a[0]-a[1]);
 const far=c.shift(),rest=c.sort(()=>Math.random()-.5),kk=1+.35*(f-1);
 g={f,M,G,seen:M.map(r=>r.map(()=>0)),mons:[],it:[],st:f<5?{x:far[0],y:far[1]}:null};
 const mk=(u,v,e,n,hp,a,d,xp,sp)=>({x:u,y:v,e,n,hp,mx:hp,a,def:d,xp,sp,cd:1});
 for(let i=0;i<6+f*3;i++){const[u,v]=rest.pop(),t=MO[R(4)];g.mons.push(mk(u,v,t[0],t[1],t[2]*kk|0,t[3]+f,t[4],t[5]*f,1.5+.15*f))}
 for(let i=0;i<8;i++){const[u,v]=rest.pop();g.it.push({x:u,y:v})}
 if(f==5)g.mons.push(mk(far[0],far[1],'🐉','妖龍',140,16,4,300,1.8));
 P.x=P.y=2.5;pp={x:2.5,y:2.5,cd:0};camX=0;camY=(P.x+P.y)*16-H/2+H/2;camX=(P.x-P.y)*32;camY=(P.x+P.y)*16;
 say(`【${ZN[f-1]}】第${f}層`);ui()}
function initTown(){const N=17,M=Array.from({length:N},(_,j)=>Array.from({length:N},(_,i)=>(i==0||j==0||i==N-1||j==N-1)?1:0));
 g={f:0,M,G:N,seen:M.map(r=>r.map(()=>1)),mons:[],it:[],st:{x:N-2.5,y:N-2.5},npc:[{x:4.5,y:4.5,e:'🧕',t:'丹藥'},{x:7.5,y:4.5,e:'👳',t:'兵器'},{x:10.5,y:4.5,e:'🧙‍♂️',t:'秘笈'},{x:13.5,y:4.5,e:'🏮',t:'拍賣'}]};
 P.shop=Array.from({length:3},()=>mkGear(1+R(2)));rollAuction();
 P.x=P.y=N/2;pp={x:P.x,y:P.y,cd:0};camX=(P.x-P.y)*32;camY=(P.x+P.y)*16;
 say('【胥國】天下修士雲集之地，北側一列分別是丹藥閣、兵器閣、秘笈閣三位掌櫃，東側為拍賣會，東南角傳送陣可下山歷練');ui()}
const SB={luo:'bl',qy:'bj',xue:'bx',bq:'bc'};
function ui(){const r=RE[Math.min(4,(P.lv-1)/3|0)]+((P.lv-1)%3+1)+'層';
 $('h1').textContent=`${g.f?ZN[g.f-1]+' '+g.f+'/5':'胥國'}｜${r} Lv${P.lv}｜修為 ${P.xp}/${P.lv*20}｜💎${P.gold} ⚔️${A()} 🛡️${D()}`;
 $('ho').firstChild.style.height=Math.max(0,P.hp/P.mhp*100)+'%';$('mo').firstChild.style.height=P.mp/P.mmp*100+'%';
 $('ht').textContent=P.hp+'/'+P.mhp;$('mt').textContent=(P.mp|0)+'/'+P.mmp;
 document.body.classList.toggle('town',g.f===0);
 const bh=$('bh');if(bh){bh.classList.toggle('off',g.f===0)}
 SK.forEach(s=>{const b=$(SB[s.id]);if(!b)return;const lv=P.skills[s.id]||0;b.classList.toggle('off',!lv);b.innerHTML=s.icon+(lv?`<i class="lv">${lv}</i>`:'');b.disabled=!lv})}

/* 即時戰鬥 */
function hit(m){const c=Math.random()<.12,d=Math.max(1,A()-m.def+R(3))*(c?2:1);m.hp-=d;flo(m.x,m.y,(c?'暴擊 ':'')+'-'+d,c?'#fc4':'#fff');fx.push({x:m.x,y:m.y,t:.25,e:'💥'});sfx(300);if(m.hp<=0)kill(m)}
function gain(n){P.xp+=n;while(P.xp>=P.lv*20){P.xp-=P.lv*20;P.lv++;P.mhp+=12;P.mmp+=3;P.hp=P.mhp;P.mp=P.mmp;say(`✨ 突破至 Lv${P.lv}！`);flo(P.x,P.y,'境界突破！','#4f9');sfx(880)}}
function pxp(p,n){p.xp+=n;while(p.xp>=p.lv*30){p.xp-=p.lv*30;p.lv++;say(`${p.e}${p.n} 成長至 Lv${p.lv}！`)}}
function kill(m){g.mons.splice(g.mons.indexOf(m),1);say(`斬殺${m.n}，得修為${m.xp}`);
 if(Math.random()<.3)g.it.push({x:m.x,y:m.y});const pt=P.pets[P.pa];if(pt)pxp(pt,2);
 if(m.n=='妖龍'){dead=2;say('🎉 妖龍伏誅，你踏上飛升之路！按任意鍵再入輪迴');return}
 gain(m.xp)}
function mkGear(f){const r=Math.random()*100,gi=r<1+f*.5?3:r<8+f*1.5?2:r<30+f*3?1:0,k='war'[R(3)],v=Math.round((2+f*2+R(3))*GR[gi][2]);return{k,g:gi,v,n:{w:WN,a:AN,r:RN}[k][R(3)]}}
function gear(){const o=mkGear(g.f);if(!P.e[o.k])P.e[o.k]=o;else if(P.bag.length<20)P.bag.push(o);else P.gold+=o.v*3;say(`獲得 ${it(o)}`)}
function loot(){const k=R(20),r=Math.random();
 if(k<4){P.pill.pei++;say('拾得 🧪 培元丹')}else if(k<5){P.pill.ju++;say('拾得 聚氣丹')}
 else if(k<7){const n=10+R(20)*g.f;P.gold+=n;say(`拾得 💎 靈石×${n}`)}
 else if(k<10){const t=r<.06?1:0;P.herb[t]++;say(`採得 🌿${HN[t]}靈草`)}
 else if(k<11){P.egg++;say('拾得 🥚 靈獸卵')}
 else if(k<13){const s=SK[R(SK.length)];P.skills[s.id]=(P.skills[s.id]||0)+1;say(`📜 拾得${s.book}，${P.skills[s.id]>1?'功法精進至 Lv'+P.skills[s.id]:'習得新功法 '+s.icon+s.name}`);sfx(760)}
 else gear()}
function sword(){if(dead)return rez();if(P.mp<5||P.sk>0)return;P.mp-=5;P.sk=2.5;let n=0;
 for(const m of[...g.mons])if(dist(m,P)<=3){m.hp-=Math.max(1,A()*1.5-m.def|0);flo(m.x,m.y,'劍','#5af');n++;if(m.hp<=0)kill(m)}
 fx.push({x:P.x,y:P.y,t:.5,ring:1});say(n?`青竹蜂雲劍出鞘，命中 ${n} 敵`:'劍氣落空');sfx(650)}
function usep(k){if(dead)return rez();if(P.pill[k]<1)return say('沒有此丹藥');P.pill[k]--;
 if(k=='pei'){P.hp=Math.min(P.mhp,P.hp+P.mhp*.4|0);P.mp=Math.min(P.mmp,P.mp+5)}else if(k=='ju')P.mp=Math.min(P.mmp,P.mp+15);else gain(60);
 say('服下'+{pei:'培元丹',ju:'聚氣丹',zhu:'築基丹'}[k]);sfx(500);if(cur)pn(cur)}
const pot=()=>usep('pei');
let lastMX=0,lastMY=1,npcCD=0;
function castLuo(){if(dead)return rez();const lvl=P.skills.luo;if(!lvl)return say('尚未習得《羅燕步》，須從敵人、寶箱或坊市尋得秘笈');
 if(P.mp<6||P.scd.luo>0)return;P.mp-=6;P.scd.luo=5;const tot=1.6+lvl*.5,n=8;
 for(let i=0;i<n;i++)step(P,lastMX*tot/n,lastMY*tot/n,.28);
 P.iframe=.5+lvl*.05;fx.push({x:P.x,y:P.y,t:.4,e:'💨'});say('羅燕步，身形如飛燕掠過');sfx(500)}
function castQY(){if(dead)return rez();const lvl=P.skills.qy;if(!lvl)return say('尚未習得《青元劍訣》，須從敵人、寶箱或坊市尋得秘笈');
 if(P.mp<9||P.scd.qy>0)return;P.mp-=9;P.scd.qy=3.5;let n=0;const rad=1.8+lvl*.2;
 for(const m of[...g.mons])if(dist(m,P)<=rad){const d=Math.max(1,A()*(2.4+lvl*.3)-m.def|0);m.hp-=d;flo(m.x,m.y,'-'+d,'#5ff');fx.push({x:m.x,y:m.y,t:.3,e:'💠'});n++;if(m.hp<=0)kill(m)}
 fx.push({x:P.x,y:P.y,t:.5,ring:1,col:'#5ff'});say(n?`青元劍訣貫穿 ${n} 敵`:'劍氣落空');sfx(750)}
function castXue(){if(dead)return rez();const lvl=P.skills.xue;if(!lvl)return say('尚未習得《血影遁》，須從敵人、寶箱或坊市尋得秘笈');
 let t=null,td=8;for(const m of g.mons){const d=dist(m,P);if(d<td){td=d;t=m}}

function upd(dt){
 const sx=KX+JX,sy=KY+JY,l=Math.min(1,Math.hypot(sx,sy));
 if(l>.05){const wx=sx/TW+sy/TH,wy=sy/TH-sx/TW,n=Math.hypot(wx,wy);step(P,wx/n*l*4.6*dt,wy/n*l*4.6*dt);lastMX=wx/n;lastMY=wy/n}
 P.mp=Math.min(P.mmp,P.mp+dt*.6);P.cd-=dt;P.sk-=dt;P.hurt-=dt;P.iframe-=dt;npcCD-=dt;for(const k in P.scd)P.scd[k]=Math.max(0,P.scd[k]-dt);
 let nm=null,nd=1.4;for(const m of g.mons){const d=dist(m,P);if(d<nd){nd=d;nm=m}}
 if(nm&&P.cd<=0){P.cd=.6;hit(nm)}
 if(!dead)for(const m of g.mons){m.cd-=dt;if(m.slowT>0)m.slowT-=dt;const spd=m.sp*(m.slowT>0?.4:1),dx=P.x-m.x,dy=P.y-m.y,d=Math.hypot(dx,dy);
  if(d<7&&d>.85)step(m,dx/d*spd*dt,dy/d*spd*dt,.3);
  else if(d<=.85&&m.cd<=0){m.cd=1.2;if(P.iframe>0){flo(P.x,P.y,'閃避','#4f9')}else{const dm=Math.max(1,m.a-D()+R(3));P.hp-=dm;P.hurt=.25;flo(P.x,P.y,'-'+dm,'#f55');sfx(120);if(P.hp<=0){dead=1;say('💀 道消身殞。按任意鍵於本層復活（靈石-30%）')}}}}
 const pt=P.pets[P.pa];if(pt&&!dead){pp.cd-=dt;const d=dist(pp,P);if(d>1.3)step(pp,(P.x-pp.x)/d*4.8*dt,(P.y-pp.y)/d*4.8*dt,.25);if(d>8){pp.x=P.x;pp.y=P.y}
  if(pp.cd<=0){let t=null,td=2.8;for(const m of g.mons){const q=dist(m,pp);if(q<td){td=q;t=m}}
   if(t){pp.cd=1.2;const dm=Math.max(1,pa(pt)-t.def+R(2));t.hp-=dm;flo(t.x,t.y,'-'+dm,'#9f9');fx.push({x:t.x,y:t.y,t:.2,e:'✨'});if(t.hp<=0)kill(t)}}}
 for(let i=g.it.length-1;i>=0;i--)if(dist(g.it[i],P)<.6){g.it.splice(i,1);loot()}
 if(g.npc)for(const n of g.npc)if(dist(n,P)<.8&&npcCD<=0&&$('pn').hidden){pn(n.t);npcCD=1;break}
 if(g.st&&dist(g.st,P)<.7){P.hp=Math.min(P.mhp,P.hp+P.mhp*.3|0);sfx(700);init(0,g.f===0?(P.floor||1):g.f+1)}
 for(let v=P.y-7|0;v<=P.y+7;v++)for(let u=P.x-7|0;u<=P.x+7;u++)if(g.seen[v]&&g.seen[v][u]===0&&Math.hypot(u+.5-P.x,v+.5-P.y)<=7)g.seen[v][u]=1;
 fl.forEach(f=>f.t-=dt);fl=fl.filter(f=>f.t>0);fx.forEach(f=>f.t-=dt);fx=fx.filter(f=>f.t>0)}

/* 2.5D 等角投影繪製：地磚菱形 + 有高度的牆塊 + 直立 emoji 與地面陰影，依深度排序 */
function draw(){x.fillStyle='#07060c';x.fillRect(0,0,W,H);
 const px=(P.x-P.y)*32,py=(P.x+P.y)*16;camX+=(px-camX)*.15;camY+=(py-camY)*.15;
 const pr=(u,v,z=0)=>[W/2+(u-v)*32-camX,H/2+(u+v)*16-camY-z],poly=(pts,c)=>{x.beginPath();pts.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.closePath();x.fillStyle=c;x.fill()},
 vis=(u,v)=>g.f===0?true:Math.hypot(u+.5-P.x,v+.5-P.y)<=7,list=[],i0=Math.max(0,P.x-11|0),i1=Math.min(g.G-1,P.x+11),j0=Math.max(0,P.y-11|0),j1=Math.min(g.G-1,P.y+11);
 x.textAlign='center';x.textBaseline='middle';
 const TM=g.f===0,WC=TM?['#9a9ea6','#7d818c','#c9ccd1']:['#3a2d4d','#2a2040','#5d4a78'],FC=TM?['#b9bcc2','#a7aab0']:['#241e35','#1f1a2e'];
 for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){if(!g.seen[j][i])continue;const v=vis(i,j),w=g.M[j][i];
  if(w){list.push({d:i+j+1,f:()=>{x.globalAlpha=v?1:.4;const T=pr(i,j),Rr=pr(i+1,j),B=pr(i+1,j+1),L=pr(i,j+1),up=p=>[p[0],p[1]-WH];
   poly([L,B,up(B),up(L)],WC[0]);poly([B,Rr,up(Rr),up(B)],WC[1]);poly([up(T),up(Rr),up(B),up(L)],WC[2]);x.globalAlpha=1}})}
  else{x.globalAlpha=v?1:.4;poly([pr(i,j),pr(i+1,j),pr(i+1,j+1),pr(i,j+1)],FC[(i+j)&1]);x.globalAlpha=1}}
 const ent=(o,e,sz,d)=>list.push({d:o.x+o.y,f:()=>{const[a,b]=pr(o.x,o.y);x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.ellipse(a,b,sz*.5,sz*.22,0,0,7);x.fill();
   x.font=sz+'px sans-serif';x.fillText(e,a,b-sz*.45);if(o.mx){x.fillStyle='#d64545';x.fillRect(a-14,b-sz-6,28*o.hp/o.mx,4)}}});
 if(g.st&&g.seen[g.st.y|0][g.st.x|0])ent(g.st,'🌀',34);
 if(g.npc)g.npc.forEach(n=>ent(n,n.e,36));
 g.it.forEach(o=>vis(o.x-.5|0,o.y-.5|0)&&ent(o,'🎁',26));
 g.mons.forEach(m=>Math.hypot(m.x-P.x,m.y-P.y)<=7&&ent(m,m.e,m.e=='🐉'?52:34));
 if(P.pets[P.pa])ent(pp,P.pets[P.pa].e,26);ent(P,'🧙',38);
 list.sort((a,b)=>a.d-b.d).forEach(o=>o.f());
 if([[1,0],[0,1],[1,1]].some(([a,b])=>solid(P.x+a,P.y+b))){const[a,b]=pr(P.x,P.y);x.globalAlpha=.4;x.font='38px sans-serif';x.fillText('🧙',a,b-17);x.globalAlpha=1}
 fx.forEach(f=>{const[a,b]=pr(f.x,f.y);if(f.ring){x.strokeStyle=f.col||'#5af';x.lineWidth=3;x.beginPath();x.ellipse(a,b,(.5-f.t)*6*32,(.5-f.t)*6*16,0,0,7);x.stroke()}else{x.font='26px sans-serif';x.fillText(f.e,a,b-30)}});
 x.font='bold 16px sans-serif';fl.forEach(f=>{const[a,b]=pr(f.x,f.y);x.fillStyle=f.c;x.fillText(f.s,a,b-44-(.8-f.t)*40)});
 if(P.hurt>0){x.fillStyle=`rgba(200,0,0,${P.hurt})`;x.fillRect(0,0,W,H)}}

/* 8-bit 音樂：方波旋律（宮調五聲音階）+ 三角波低音 */
function au(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume()}
function tone(f,d,ty='square',v=.04){if(!ac)return;const o=ac.createOscillator(),n=ac.createGain(),t=ac.currentTime;o.type=ty;o.frequency.value=f;n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n).connect(ac.destination);o.start(t);o.stop(t+d)}
const sfx=f=>tone(f,.07,'square',.05),ML=[0,4,7,9,7,4,2,null,4,7,9,12,9,7,4,null,9,7,4,2,0,2,4,7,9,7,4,2,0,null,-3,null],BS=[0,-3,-5,-3];let s8=0;
function togMusic(){au();if(tm){clearInterval(tm);tm=0}else tm=setInterval(()=>{const s=ML[s8%32];if(s!=null)tone(220*2**(s/12),.2);if(s8%4==0)tone(110*2**(BS[(s8>>3)%4]/12),.45,'triangle',.09);s8++},230);if(cur=='系統')pn('系統')}

系統:()=>`<button onclick="portalTown();cls()">🏯 返回胥國</button><br><button onclick="expo()">📤 匯出存檔 (JSON)</button> <label class="fb">📥 匯入存檔<input type="file" accept=".json,application/json" hidden onchange="impf(this.files[0])"></label><br><button onclick="togMusic()">🎵 ${tm?'關閉':'開啟'} 8-bit 音樂</button>${dp?' <button onclick="dp.prompt()">📲 安裝到裝置</button>':''}<br><button onclick="if(confirm('清除所有進度並重新開始？')){localStorage.removeItem('xxl');init(1,0);cls()}">🗑️ 重新開始</button><br><small>進度每 8 秒自動存於瀏覽器。iOS 請用 Safari「分享→加入主畫面」安裝。也可隨時按 🌀（H 鍵）從任意層數瞬間返城，返城後由城中傳送陣可直接回到離開時的層數。</small>`};
function pn(t){cur=t;$('pn').hidden=false;$('tb').innerHTML=TB.map(k=>`<button ${k==t?'class="on"':''} onclick="pn('${k}')">${k}</button>`).join('');$('pc').innerHTML=T[t]();held.clear();ax()}
function cls(){$('pn').hidden=true;cur='';npcCD=1.2}
setInterval(()=>{if(cur=='靈植'&&!$('pn').hidden&&sig!=sg())$('pc').innerHTML=T.靈植()},1000);
function eq(i){const o=P.bag[i],old=P.e[o.k];P.e[o.k]=o;P.bag.splice(i,1);if(old)P.bag.push(old);say(`裝備 ${it(o)}`);pn('物品')}
function uneq(k){if(P.bag.length>=20)return say('背包已滿');P.bag.push(P.e[k]);delete P.e[k];pn('裝備')}
function sell(i){P.gold+=P.bag[i].v*3;P.bag.splice(i,1);pn('物品')}
function buyPot(k,price){if(P.gold<price)return say('靈石不足');P.gold-=price;P.pill[k]++;say('購得 '+({pei:'培元丹',ju:'聚氣丹',zhu:'築基丹'}[k]));pn('丹藥')}
function buyGear(i){const o=P.shop[i];if(!o)return;const price=o.v*5;if(P.gold<price)return say('靈石不足');
 if(!P.e[o.k]||P.bag.length<20){P.gold-=price;if(!P.e[o.k])P.e[o.k]=o;else P.bag.push(o);P.shop[i]=null;say(`購得 ${it(o)}`)}else say('背包已滿');pn('兵器')}
function buySkill(id){const s=SK.find(v=>v.id==id),lvl=P.skills[id]||0,price=200+lvl*250;
 if(P.gold<price)return say('靈石不足，此秘笈需 💎'+price);P.gold-=price;P.skills[id]=lvl+1;say(`📜 購得${s.book}，${lvl?'功法精進至 Lv'+(lvl+1):'習得新功法 '+s.icon+s.name}`);pn('秘笈')}
function rollAuction(){if(Math.random()<.4){const s=SK[R(SK.length)],lvl=P.skills[s.id]||0;P.auction={type:'skill',id:s.id,price:600+lvl*300}}
 else{const o=mkGear(3+R(2));P.auction={type:'gear',o,price:o.v*14}}}
function buyAuction(){const a=P.auction;if(!a)return;if(P.gold<a.price)return say('靈石不足，此標的需 💎'+a.price);
 P.gold-=a.price;if(a.type=='skill'){const s=SK.find(v=>v.id==a.id),lvl=P.skills[a.id]||0;P.skills[a.id]=lvl+1;say(`🏆 拍得${s.book}！${lvl?'功法精進至 Lv'+(lvl+1):'習得新功法 '+s.icon+s.name}`)}
 else{const o=a.o;if(!P.e[o.k])P.e[o.k]=o;else if(P.bag.length<20)P.bag.push(o);else P.gold+=o.v*3;say(`🏆 拍得 ${it(o)}！`)}
 P.auction=null;pn('拍賣')}
function alch(i){const a=AL[i];if(a[2].some((n,j)=>P.herb[j]<n)||P.gold<a[3])return say('材料不足');a[2].forEach((n,j)=>P.herb[j]-=n);P.gold-=a[3];
 if(Math.random()<a[4]){P.pill[a[1]]++;say(`🔥 煉成 ${a[0]}！`)}else say('💥 丹爐炸裂，藥材盡毀…');sfx(400);pn('煉丹')}
function plant(i){if(P.gold<5)return say('靈石不足');P.gold-=5;P.plot[i]=Date.now();say('🌱 播下靈草種子');pn('靈植')}
function harv(i){const tr=P.plot[i]?tier(el(P.plot[i])):-1;if(tr<0)return say('靈草尚未成熟');P.herb[tr]++;P.plot[i]=null;say(`採收 ${HN[tr]}靈草`);pn('靈植')}
function bottle(){if(Date.now()<P.bt)return say('掌天瓶尚在冷卻');P.plot=P.plot.map(t=>t&&t-120000);P.bt=Date.now()+90000;say('🍾 掌天瓶綠液滴落，靈草飛速生長！');pn('靈植')}
function hatch(){if(P.egg<1||P.pets.length>=3)return say('無法孵化（無卵或靈獸袋已滿）');P.egg--;const t=PT[P.pets.length?R(3):0];P.pets.push({e:t[0],n:t[1],lv:1,xp:0});say(`🥚 孵出 ${t[0]}${t[1]}！`);pn('靈寵')}
function feed(i){if(P.herb[0]<1)return say('缺少百年靈草');P.herb[0]--;pxp(P.pets[i],30);pn('靈寵')}
function act(i){P.pa=P.pa==i?-1:i;pp={x:P.x,y:P.y,cd:0};pn('靈寵')}
function expo(){const b=new Blob([JSON.stringify({v:1,f:g.f,P},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='xiuxian-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999);say('📤 已匯出存檔')}
function impf(f){if(f)f.text().then(t=>{try{load(JSON.parse(t));cls()}catch{say('❌ 存檔格式錯誤')}})}
function load(o){if(!o||!o.P||typeof o.P.lv!='number')throw 0;P=Object.assign(newP(),o.P);if(P.hp<=0)P.hp=P.mhp;init(0,o.f>0&&o.f<6?o.f:1);say('存檔已載入')}

const held=new Set(),ax=()=>{KX=(held.has('d')||held.has('arrowright'))-(held.has('a')||held.has('arrowleft'));KY=(held.has('s')||held.has('arrowdown'))-(held.has('w')||held.has('arrowup'))};
onkeydown=e=>{au();const k=e.key.toLowerCase();if(dead&&!e.repeat)return rez();
 if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){e.preventDefault();held.add(k);ax()}
 else if(k==' '||k=='e'){e.preventDefault();sword()}else if(k=='q')pot();else if(k=='h')portalTown();else if(k=='r')castLuo();else if(k=='f')castQY();else if(k=='t')castXue();else if(k=='g')castBQ();else if(k=='k')pn('功法');else if(k=='m')togMusic();else if(k=='i')pn('物品');else if(k=='c')pn('裝備');else if(k=='escape')cls()};
onkeyup=e=>{held.delete(e.key.toLowerCase());ax()};onblur=()=>{held.clear();ax()};
const jv=$('joy'),kn=jv.firstChild;
function jm(e){const r=jv.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.hypot(dx,dy),k=Math.min(1,m/(r.width/2))/(m||1);JX=dx*k;JY=dy*k;kn.style.transform=`translate(${JX*40}px,${JY*40}px)`}
jv.onpointerdown=e=>{if(dead)return rez();jv.setPointerCapture(e.pointerId);au();jm(e)};
jv.onpointermove=e=>{if(jv.hasPointerCapture(e.pointerId))jm(e)};
jv.onpointerup=jv.onpointercancel=()=>{JX=JY=0;kn.style.transform=''};
